<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>الوصول مرفوض | Hadir</title>
<link rel="icon" href="/assets/hadir-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:'Tajawal',sans-serif;color:#4c4770;background:radial-gradient(700px 400px at 15% 0%,#4c2785,transparent 60%),radial-gradient(600px 400px at 100% 100%,#5b21b6,transparent 55%),linear-gradient(160deg,#1b1138,#241342 60%,#170d2c)}
.card{width:min(100%,480px);background:#fff;border-radius:26px;padding:44px 36px;text-align:center;box-shadow:0 40px 110px rgba(10,6,27,.55)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px}
.brand img{width:46px;height:46px;border-radius:14px;object-fit:cover;box-shadow:0 6px 16px rgba(47,107,255,.35)}
.brand b{font-size:21px;font-weight:900;color:#6d28d9;line-height:1.1}
.brand small{display:block;color:#8b87a8;font-size:11px;font-weight:700}
.code{font-size:64px;font-weight:900;line-height:1;background:linear-gradient(135deg,#8b5cf6,#6d28d9);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:22px;color:#241d47;margin:10px 0 8px}
p{color:#8b87a8;font-size:14.5px;line-height:1.7;margin-bottom:26px}
.reload{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:50px;text-decoration:none;font-weight:800;font-size:14.5px;background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;box-shadow:0 8px 20px -6px rgba(124,58,237,.5);transition:.2s}
.reload:hover{transform:translateY(-2px)}
a:focus-visible{outline:3px solid #a78bfa;outline-offset:3px;border-radius:10px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <img src="/assets/hadir-icon.svg" alt="شعار Hadir">
    <span><b>Hadir</b><small>Digital Agency</small></span>
  </div>
  <div class="code">403</div>
  <h1>الوصول مرفوض</h1>
  <p>يبدو أنك تستخدم شبكة VPN أو وكيلاً (Proxy) للاتصال بالموقع.<br>أوقفها ثم أعد تحميل الصفحة للمتابعة بشكل طبيعي.</p>
  <a class="reload" href="/">إعادة المحاولة</a>
</main>
</body>
</html>
